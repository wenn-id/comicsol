[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comic-sol"
dynamic = ["version"]
description = "Local-first deterministic comic production pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alwan Juliawan" }]
dependencies = ["Pillow==12.3.0"]

[project.optional-dependencies]
mcp = ["mcp==2.0.0"]

[project.scripts]
comic-sol = "comic_sol_product.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".native-dist", ".worktrees", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/assemble_release.py" = ["E402"]  # Imports follow the repository path bootstrap.

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
files = [
    "scripts/project_io.py",
    "scripts/core_primitives.py",
    "comic_sol_product/cli.py",
    "comic_sol_product/mcp.py",
    "scripts/stage_registry.py",
    "comic_sol_product/release.py",
    "scripts/release_qualification.py",
    "scripts/release_evidence.py",
]
python_version = "3.11"
follow_imports = "skip"
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["comic_sol_product", "scripts"]
omit = ["scripts/check_coverage.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.setuptools.dynamic]
version = {attr = "comic_sol_product.__version__"}

[tool.setuptools.packages.find]
include = ["comic_sol_product*"]
