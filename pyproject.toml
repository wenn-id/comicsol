[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "comic-sol"
dynamic = ["version"]
description = "Provider-neutral, local-first comic production pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alwan Juliawan" }]
maintainers = [{ name = "Alwan Juliawan" }]
keywords = [
    "comic",
    "manga",
    "comic-generation",
    "lettering",
    "typesetting",
    "pdf-export",
    "deterministic",
    "agent-skill",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = ["Pillow==13.0.0"]

[project.urls]
Homepage = "https://github.com/wenn-id/comicsol"
Repository = "https://github.com/wenn-id/comicsol"
Documentation = "https://github.com/wenn-id/comicsol/tree/main/docs"
Changelog = "https://github.com/wenn-id/comicsol/blob/main/CHANGELOG.md"
"Issue Tracker" = "https://github.com/wenn-id/comicsol/issues"
"Security Policy" = "https://github.com/wenn-id/comicsol/blob/main/SECURITY.md"

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]

[project.scripts]
comic-sol = "comic_sol_product.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".native-dist", ".worktrees", "build", "dist"]

[tool.ruff.lint]
select = ["B", "C90", "E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/assemble_release.py" = ["E402"]  # Imports follow the repository path bootstrap.
"scripts/container_sbom.py" = ["E402"]  # Imports follow the repository path bootstrap.

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
files = [
    "scripts/project_io.py",
    "scripts/core_primitives.py",
    "comic_sol_product/cli.py",
    "comic_sol_product/setup.py",
    "comic_sol_product/mcp.py",
    "scripts/stage_registry.py",
    "comic_sol_product/release.py",
    "scripts/release_qualification.py",
    "scripts/release_evidence.py",
    "scripts/release_visual_gate.py",
    "comic_sol_product/version.py",
    "comic_sol_product/errors.py",
    "comic_sol_product/config.py",
    "comic_sol_product/distribution.py",
    "comic_sol_product/engine_api.py",
    "comic_sol_product/skill_install.py",
    "comic_sol_product/__init__.py",
    "comic_sol_product/cli_command_spec.py",
    "scripts/__init__.py",
    "scripts/assemble_release.py",
    "scripts/benchmark_summary.py",
    "scripts/build_portable.py",
    "scripts/character_identity.py",
    "scripts/check_coverage.py",
    "scripts/check_ruff_baseline.py",
    "scripts/clean_install_smoke.py",
    "scripts/command_service.py",
    "scripts/container_runtime_audit.py",
    "scripts/container_sbom.py",
    "scripts/dogfood_report.py",
    "scripts/dogfood_summary.py",
    "scripts/export_pdf.py",
    "scripts/font_cmap.py",
    "scripts/font_coverage.py",
    "scripts/handoff_archive.py",
    "scripts/input_limits.py",
    "scripts/installed_mcp_smoke.py",
    "scripts/layouts.py",
    "scripts/lifecycle_contracts.py",
    "scripts/live_visual_evidence.py",
    "scripts/materialize_sample.py",
    "scripts/mcp_server.py",
    "scripts/normalize_panels.py",
    "scripts/pdf_quality.py",
    "scripts/portable_release_smoke.py",
    "scripts/quality_records.py",
    "scripts/quality_sample.py",
    "scripts/raster_limits.py",
    "scripts/reference_strategy.py",
    "scripts/release_identity.py",
    "scripts/render_report.py",
    "scripts/repair_strategy.py",
    "scripts/schema.py",
    "scripts/sfx_repair.py",
    "scripts/sfx_verification.py",
    "scripts/sync_plugin_bundle.py",
    "scripts/typography.py",
    "scripts/version.py",
]
python_version = "3.11"
follow_imports = "skip"
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["comic_sol_product", "integrations", "scripts"]
omit = ["scripts/check_coverage.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.setuptools.dynamic]
version = {attr = "comic_sol_product.__version__"}

[tool.setuptools.packages.find]
include = ["comic_sol_product*"]
