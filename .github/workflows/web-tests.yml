name: Web Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-tests:
    name: ${{ matrix.os }} web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lock: linux
          - os: macos-latest
            lock: macos
          - os: windows-latest
            lock: windows
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python 3.11
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.11"
    - name: Install Web dependencies from hash lock
      shell: bash
      run: |
        python -m pip install --require-hashes -r requirements/locks/web-${{ matrix.lock }}-x86_64.txt
    - name: Build and install the Web distribution without resolving uncontrolled dependencies
      shell: bash
      run: |
        cd web
        python -m build --no-isolation --wheel
        python -m pip install --no-deps --force-reinstall dist/*.whl
    - name: Verify isolated Web test discovery
      run: python -m unittest discover -s web/tests -p "test_app.py" -v
    - name: Run root isolated-discovery regression
      run: python -m unittest tests.test_isolated_discovery -v
    - name: Run root lock-provenance regression
      run: python -m unittest tests.test_lock_provenance -v
    - name: Get healthz via the test client
      env:
        COMIC_SOL_WEB_SESSION_SECRET: 000000000000000000000000000000000000000000000000
        COMIC_SOL_WEB_ENCRYPTION_SECRET: 000000000000000000000000000000000000000000000000
        COMIC_SOL_WEB_DATA_ROOT: ${{ runner.temp }}/comic-sol-web-data
      run: |
        python - <<'PYEOF'
        import os
        from fastapi.testclient import TestClient
        from comic_sol_web.config import WebConfig
        from comic_sol_web.app import create_app

        config = WebConfig.from_env(os.environ)
        client = TestClient(create_app(config))
        response = client.get("/healthz")
        assert response.status_code == 200, response.status_code
        assert response.json() == {"status": "ok"}, response.json()
        print("healthz ok")
        PYEOF

  Web-quality:
    name: Web quality gates
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python 3.11
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.11"
    - name: Install Web dependencies from hash lock
      run: python -m pip install --require-hashes -r requirements/locks/web-linux-x86_64.txt
    - name: Ruff check (Web)
      run: python -m ruff check web
    - name: Ruff format check (Web)
      run: python -m ruff format --check web
    - name: Mypy (Web scope)
      run: python -m mypy web
