name: Release Qualification

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing candidate tag whose published assets must be qualified"
        required: true
        type: string
      candidate_sha:
        description: "Exact commit the candidate tag and published bytes must represent"
        required: true
        type: string
      tag_object_sha:
        description: "Immutable annotated tag-object SHA captured by release prepare"
        required: true
        type: string
      main_sha:
        description: "Protected main SHA used for the ancestry decision"
        required: true
        type: string
      matched_ruleset_ids:
        description: "Canonical JSON array of active matching release-tag ruleset IDs"
        required: true
        type: string
      approved_bypass_actors:
        description: "Canonical JSON array of approved release creation bypass actors"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Existing candidate tag whose published assets must be qualified"
        required: true
        type: string
      candidate_sha:
        description: "Exact commit the candidate tag and published bytes must represent"
        required: true
        type: string
      tag_object_sha:
        description: "Immutable annotated tag-object SHA captured by release prepare"
        required: true
        type: string
      main_sha:
        description: "Protected main SHA used for the ancestry decision"
        required: true
        type: string
      matched_ruleset_ids:
        description: "Canonical JSON array of active matching release-tag ruleset IDs"
        required: true
        type: string
      approved_bypass_actors:
        description: "Canonical JSON array of approved release creation bypass actors"
        required: true
        type: string
    outputs:
      decision:
        description: "Fail-closed aggregate qualification decision"
        value: ${{ jobs.aggregate.outputs.decision }}
      summary_sha256:
        description: "Digest of the aggregate qualification JSON"
        value: ${{ jobs.aggregate.outputs.summary_sha256 }}

permissions:
  contents: read
  attestations: read

jobs:
  identity:
    name: Verify candidate tag identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify candidate identity provenance before qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          TAG_OBJECT_SHA: ${{ inputs.tag_object_sha }}
          MAIN_SHA: ${{ inputs.main_sha }}
          MATCHED_RULESET_IDS: ${{ inputs.matched_ruleset_ids }}
          APPROVED_BYPASS_ACTORS: ${{ inputs.approved_bypass_actors }}
        run: |
          set -euo pipefail
          mkdir qualification-identity
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern candidate-identity.json \
            --pattern candidate-identity.json.sha256 \
            --dir qualification-identity
          (cd qualification-identity && sha256sum -c candidate-identity.json.sha256)
          gh attestation verify qualification-identity/candidate-identity.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow wenn-id/comicsol/.github/workflows/release.yml \
            --source-digest "$CANDIDATE_SHA" \
            --source-ref "refs/tags/$RELEASE_TAG" \
            --deny-self-hosted-runners
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          identity = json.loads(
              Path("qualification-identity/candidate-identity.json").read_text(encoding="utf-8")
          )
          expected = {
              "tag": os.environ["RELEASE_TAG"],
              "candidate_commit": os.environ["CANDIDATE_SHA"],
              "tag_object_sha": os.environ["TAG_OBJECT_SHA"],
              "protected_main_sha": os.environ["MAIN_SHA"],
              "matched_ruleset_ids": json.loads(os.environ["MATCHED_RULESET_IDS"]),
              "approved_bypass_actors": json.loads(os.environ["APPROVED_BYPASS_ACTORS"]),
          }
          for field, value in expected.items():
              if identity.get(field) != value:
                  raise RuntimeError(
                      f"authenticated candidate identity {field} does not match qualification input"
                  )
          PY
      - name: Bind qualification to the exact published candidate identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          TAG_OBJECT_SHA: ${{ inputs.tag_object_sha }}
          MAIN_SHA: ${{ inputs.main_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$CANDIDATE_SHA" refs/remotes/origin/main
          git merge-base --is-ancestor "$MAIN_SHA" refs/remotes/origin/main
          git ls-remote --tags origin \
            "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" \
            > qualification-refs.txt
          python3 scripts/release_identity.py remote \
            --refs-file qualification-refs.txt \
            --tag "$RELEASE_TAG" \
            --tag-object-sha "$TAG_OBJECT_SHA" \
            --candidate-commit "$CANDIDATE_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > release.json
          python3 scripts/release_identity.py release \
            --release-json release.json \
            --refs-file qualification-refs.txt \
            --tag "$RELEASE_TAG" \
            --tag-object-sha "$TAG_OBJECT_SHA" \
            --candidate-commit "$CANDIDATE_SHA" \
            --require-immutable-prerelease
          test "$(jq -r .draft release.json)" = false
          test "$(jq -r .prerelease release.json)" = true
          test "$(jq -r .immutable release.json)" = true

  native:
    name: qualify (${{ matrix.platform }})
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            arch: x86_64
            installer: install.sh
          # macOS releases ship arm64; cryptography publishes no x86_64 macOS
          # wheel since 49.0.0, so the release matrix builds arm64 there.
          - platform: macos
            runner: macos-latest
            arch: arm64
            installer: install.sh
          - platform: windows
            runner: windows-latest
            arch: x86_64
            installer: install.ps1
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Download exact published release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          INSTALLER: ${{ matrix.installer }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive="comic-sol-${version}-${PLATFORM}-${ARCH}.zip"
          metadata="comic-sol-${version}-${PLATFORM}-${ARCH}.metadata.json"
          sbom="comic-sol-${version}-${PLATFORM}-${ARCH}.sbom.json"
          mkdir -p qualification
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive" \
            --pattern SHA256SUMS \
            --pattern SHA256SUMS.sigstore.json \
            --pattern "$INSTALLER" \
            --pattern "$metadata" \
            --pattern "$sbom" \
            --pattern candidate-identity.json \
            --pattern candidate-identity.json.sha256 \
            --dir qualification
          test -s "qualification/$archive"
          test -s qualification/SHA256SUMS
          test -s qualification/SHA256SUMS.sigstore.json
          test -s "qualification/$INSTALLER"
          test -s "qualification/$metadata"
          test -s "qualification/$sbom"
          test -s qualification/candidate-identity.json
          test -s qualification/candidate-identity.json.sha256
      - name: Bind signed manifest and signature bundle to the candidate identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          TAG_OBJECT_SHA: ${{ inputs.tag_object_sha }}
          MAIN_SHA: ${{ inputs.main_sha }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          INSTALLER: ${{ matrix.installer }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("qualification")
          version = os.environ["RELEASE_TAG"][1:]
          identity_bytes = (root / "candidate-identity.json").read_bytes()
          sidecar = (root / "candidate-identity.json.sha256").read_text(encoding="utf-8").split()
          if sidecar[:1] != [hashlib.sha256(identity_bytes).hexdigest()]:
              raise RuntimeError("candidate identity sidecar digest mismatch")
          identity = json.loads(identity_bytes)
          if identity.get("tag") != os.environ["RELEASE_TAG"]:
              raise RuntimeError("candidate identity tag does not match qualification input")
          if identity.get("candidate_commit") != os.environ["CANDIDATE_SHA"]:
              raise RuntimeError("candidate identity commit does not match qualification input")
          if identity.get("tag_object_sha") != os.environ["TAG_OBJECT_SHA"]:
              raise RuntimeError("candidate identity tag object does not match qualification input")
          if identity.get("protected_main_sha") != os.environ["MAIN_SHA"]:
              raise RuntimeError("candidate identity protected main does not match qualification input")
          manifest = root / "SHA256SUMS"
          if hashlib.sha256(manifest.read_bytes()).hexdigest() != identity["checksum_manifest"]["sha256"]:
              raise RuntimeError("published checksum manifest does not match candidate identity")
          recorded = {
              item["name"]: item["sha256"]
              for item in [*identity["supporting_assets"], *identity["payloads"]]
          }
          for name in ("SHA256SUMS", "SHA256SUMS.sigstore.json"):
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if actual != recorded[name]:
                  raise RuntimeError(f"supporting evidence digest mismatch: {name}")
          stem = f"comic-sol-{version}-{os.environ['PLATFORM']}-{os.environ['ARCH']}"
          for name in (
              f"{stem}.zip",
              f"{stem}.metadata.json",
              f"{stem}.sbom.json",
              os.environ["INSTALLER"],
          ):
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if actual != recorded[name]:
                  raise RuntimeError(f"published payload does not match candidate identity: {name}")
          PY
      - name: Verify build provenance for the published native payloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          INSTALLER: ${{ matrix.installer }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for subject in \
            "qualification/comic-sol-${version}-${PLATFORM}-${ARCH}.zip" \
            "qualification/comic-sol-${version}-${PLATFORM}-${ARCH}.metadata.json" \
            "qualification/comic-sol-${version}-${PLATFORM}-${ARCH}.sbom.json" \
            "qualification/${INSTALLER}"; do
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow wenn-id/comicsol/.github/workflows/release.yml \
              --source-digest "$CANDIDATE_SHA" \
              --source-ref "refs/tags/$RELEASE_TAG" \
              --deny-self-hosted-runners
          done
      - name: Install cosign verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Qualify published release artifact
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          INSTALLER: ${{ matrix.installer }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive="qualification/comic-sol-${version}-${PLATFORM}-${ARCH}.zip"
          metadata="qualification/comic-sol-${version}-${PLATFORM}-${ARCH}.metadata.json"
          sbom="qualification/comic-sol-${version}-${PLATFORM}-${ARCH}.sbom.json"
          python scripts/release_qualification.py \
            --archive "$archive" \
            --installer "qualification/$INSTALLER" \
            --sha256 qualification/SHA256SUMS \
            --signature qualification/SHA256SUMS.sigstore.json \
            --version "$version" \
            --metadata "$metadata" \
            --sbom "$sbom" \
            --platform "$PLATFORM" \
            --architecture "$ARCH" \
            --summary "qualification/summary-$PLATFORM.json"
      - name: Upload qualification summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qualification-summary-${{ matrix.platform }}
          path: qualification/summary-${{ matrix.platform }}.json
          if-no-files-found: error

  # Platform-specific exceptions are written to each summary; an unavailable WSL2 runner is exception, not pass.
  wsl:
    name: qualify (wsl)
    needs: identity
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.9'
      - name: Download published Linux release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          ARCH: x86_64
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive="comic-sol-${version}-linux-${ARCH}.zip"
          metadata="comic-sol-${version}-linux-${ARCH}.metadata.json"
          sbom="comic-sol-${version}-linux-${ARCH}.sbom.json"
          mkdir -p qualification
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive" \
            --pattern SHA256SUMS \
            --pattern SHA256SUMS.sigstore.json \
            --pattern install.sh \
            --pattern "$metadata" \
            --pattern "$sbom" \
            --pattern candidate-identity.json \
            --pattern candidate-identity.json.sha256 \
            --dir qualification
      - name: Bind signed manifest and signature bundle to the candidate identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          TAG_OBJECT_SHA: ${{ inputs.tag_object_sha }}
          MAIN_SHA: ${{ inputs.main_sha }}
          ARCH: x86_64
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("qualification")
          version = os.environ["RELEASE_TAG"][1:]
          identity_bytes = (root / "candidate-identity.json").read_bytes()
          sidecar = (root / "candidate-identity.json.sha256").read_text(encoding="utf-8").split()
          if sidecar[:1] != [hashlib.sha256(identity_bytes).hexdigest()]:
              raise RuntimeError("candidate identity sidecar digest mismatch")
          identity = json.loads(identity_bytes)
          if identity.get("tag") != os.environ["RELEASE_TAG"]:
              raise RuntimeError("candidate identity tag does not match qualification input")
          if identity.get("candidate_commit") != os.environ["CANDIDATE_SHA"]:
              raise RuntimeError("candidate identity commit does not match qualification input")
          if identity.get("tag_object_sha") != os.environ["TAG_OBJECT_SHA"]:
              raise RuntimeError("candidate identity tag object does not match qualification input")
          if identity.get("protected_main_sha") != os.environ["MAIN_SHA"]:
              raise RuntimeError("candidate identity protected main does not match qualification input")
          manifest = root / "SHA256SUMS"
          if hashlib.sha256(manifest.read_bytes()).hexdigest() != identity["checksum_manifest"]["sha256"]:
              raise RuntimeError("published checksum manifest does not match candidate identity")
          recorded = {
              item["name"]: item["sha256"]
              for item in [*identity["supporting_assets"], *identity["payloads"]]
          }
          for name in (
              "SHA256SUMS",
              "SHA256SUMS.sigstore.json",
              f"comic-sol-{version}-linux-{os.environ['ARCH']}.zip",
              "install.sh",
          ):
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if actual != recorded[name]:
                  raise RuntimeError(f"published bytes do not match candidate identity: {name}")
          PY
      - name: Install cosign verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Qualify Linux artifact in WSL2
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ARCH: x86_64
        run: |
          $ErrorActionPreference = "Stop"
          # Full-match every supplied release tag before anything is dispatched into WSL.
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$') {
            throw "refusing WSL qualification: release tag is not an exact vX.Y.Z[rcN] tag: $env:RELEASE_TAG"
          }
          $wslStatus = & wsl.exe --status 2>&1
          if ($LASTEXITCODE -ne 0) {
            $reason = "WSL2 not available on this runner: $($wslStatus -join ' ')"
            $summary = [ordered]@{
              architecture = $env:ARCH
              platform = "wsl"
              status = "exception"
              checks = @()
              exceptions = @($reason)
            }
            $summary | ConvertTo-Json -Depth 3 | Set-Content -Encoding utf8 qualification/summary-wsl.json
            Write-Output $reason
            exit 0
          }
          $root = (Resolve-Path qualification).Path
          $wslRoot = (& wsl.exe wslpath -a $root).Trim()
          $version = $env:RELEASE_TAG.Substring(1)
          $architecture = $env:ARCH
          $qualificationRoot = $wslRoot
          $harnessPath = (Resolve-Path scripts/release_qualification.py).Path
          # The dispatch script below is static: no dynamic value is ever
          # interpolated into a bash command string. Every argument crosses the
          # WSL boundary as one direct argv element, and cosign crosses through
          # the WSLENV environment handoff with automatic path translation.
          $dispatchScript = @'
          #!/bin/sh
          set -eu
          version="$1"
          architecture="$2"
          qualification_root="$3"
          harness="$4"
          case "$version" in
            ''|*[!0-9A-Za-z.+_-]*)
              echo "refusing WSL qualification: unsafe version argument: $version" >&2
              exit 2
              ;;
          esac
          exec python3 "$harness" \
            --archive "$qualification_root/comic-sol-$version-linux-$architecture.zip" \
            --installer "$qualification_root/install.sh" \
            --sha256 "$qualification_root/SHA256SUMS" \
            --signature "$qualification_root/SHA256SUMS.sigstore.json" \
            --version "$version" \
            --metadata "$qualification_root/comic-sol-$version-linux-$architecture.metadata.json" \
            --sbom "$qualification_root/comic-sol-$version-linux-$architecture.sbom.json" \
            --platform wsl \
            --architecture "$architecture" \
            --summary "$qualification_root/summary-wsl.json"
          '@
          $dispatch = Join-Path $root "wsl-qualify.sh"
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText($dispatch, $dispatchScript.Replace("`r`n", "`n"), $utf8NoBom)
          $wslDispatch = (& wsl.exe wslpath -a $dispatch).Trim()
          $wslHarness = (& wsl.exe wslpath -a $harnessPath).Trim()
          $env:WSLENV = "COMIC_SOL_COSIGN/up"
          $env:COMIC_SOL_COSIGN = (Get-Command cosign.exe).Source
          & wsl.exe --exec bash "$wslDispatch" "$version" "$architecture" "$qualificationRoot" "$wslHarness"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload WSL qualification summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qualification-summary-wsl
          path: qualification/summary-wsl.json
          if-no-files-found: error

  source:
    name: qualify (published source, container, and P0 gates)
    needs: identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.15'
      - name: Download published source, installer, and container bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir qualification
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.whl' --pattern '*.tar.gz' --pattern '*.container.tar' \
            --pattern '*.container.sbom.json' \
            --pattern install.sh --pattern install.ps1 \
            --pattern SHA256SUMS --pattern SHA256SUMS.sigstore.json \
            --pattern candidate-identity.json --pattern candidate-identity.json.sha256 \
            --dir qualification
      - name: Bind signed manifest and signature bundle to the candidate identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          TAG_OBJECT_SHA: ${{ inputs.tag_object_sha }}
          MAIN_SHA: ${{ inputs.main_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("qualification")
          identity_bytes = (root / "candidate-identity.json").read_bytes()
          sidecar = (root / "candidate-identity.json.sha256").read_text(encoding="utf-8").split()
          if sidecar[:1] != [hashlib.sha256(identity_bytes).hexdigest()]:
              raise RuntimeError("candidate identity sidecar digest mismatch")
          identity = json.loads(identity_bytes)
          if identity.get("tag") != os.environ["RELEASE_TAG"]:
              raise RuntimeError("candidate identity tag does not match qualification input")
          if identity.get("candidate_commit") != os.environ["CANDIDATE_SHA"]:
              raise RuntimeError("candidate identity commit does not match qualification input")
          if identity.get("tag_object_sha") != os.environ["TAG_OBJECT_SHA"]:
              raise RuntimeError("candidate identity tag object does not match qualification input")
          if identity.get("protected_main_sha") != os.environ["MAIN_SHA"]:
              raise RuntimeError("candidate identity protected main does not match qualification input")
          if hashlib.sha256((root / "SHA256SUMS").read_bytes()).hexdigest() != identity["checksum_manifest"]["sha256"]:
              raise RuntimeError("published checksum manifest does not match candidate identity")
          recorded = {
              item["name"]: item["sha256"]
              for item in [*identity["supporting_assets"], *identity["payloads"]]
          }
          payload_names = sorted(
              path.name
              for path in root.iterdir()
              if path.name
              not in {
                  "SHA256SUMS",
                  "SHA256SUMS.sigstore.json",
                  "candidate-identity.json",
                  "candidate-identity.json.sha256",
              }
          )
          for name in payload_names:
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if actual != recorded.get(name):
                  raise RuntimeError(f"published bytes do not match candidate identity: {name}")
          PY
      - name: Install locked release and audit tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/locks/release-linux-x86_64.txt
          python -m venv "${RUNNER_TEMP}/comic-sol-audit"
          "${RUNNER_TEMP}/comic-sol-audit/bin/python" -m pip install --require-hashes -r requirements/locks/audit-python311.txt
      - name: Install cosign verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Verify signed manifest, checksums, provenance, packages, and container bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle qualification/SHA256SUMS.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/wenn-id/comicsol/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$' \
            qualification/SHA256SUMS
          python - <<'PY'
          from pathlib import Path
          from scripts.release_qualification import verify_payload_checksums
          root = Path("qualification")
          # SHA256SUMS predates the candidate identity files, so the manifest
          # deliberately names neither them nor itself; exclude all four from
          # the coverage check. The dedicated candidate-identity step binds
          # the identity files and both manifest artifacts by digest.
          payloads = sorted(
              path for path in root.iterdir()
              if path.name
              not in {
                  "SHA256SUMS",
                  "SHA256SUMS.sigstore.json",
                  "candidate-identity.json",
                  "candidate-identity.json.sha256",
              }
          )
          verify_payload_checksums(root / "SHA256SUMS", payloads)
          PY
          python -m comic_sol_product.release qualification/*.whl qualification/*.tar.gz
          for subject in qualification/*.whl qualification/*.tar.gz qualification/*.container.tar qualification/*.container.sbom.json qualification/install.sh qualification/install.ps1; do
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow wenn-id/comicsol/.github/workflows/release.yml \
              --source-digest "$CANDIDATE_SHA" \
              --source-ref "refs/tags/$RELEASE_TAG" \
              --deny-self-hosted-runners
          done
          docker load --input qualification/*.container.tar
          version="${RELEASE_TAG#v}"
          python - <<'PY'
          from pathlib import Path
          from comic_sol_product.distribution import validate_sbom_schema
          for sbom in sorted(Path("qualification").glob("*.container.sbom.json")):
              validate_sbom_schema(sbom)
          PY
          python scripts/container_runtime_audit.py \
            --image "comic-sol:${version}" \
            --expect-version "$version"
      - name: Run pip-audit security gate and source P0 qualification gates
        shell: bash
        run: |
          set +e
          failures=()
          python -m unittest discover -s tests -v
          [ $? -eq 0 ] || failures+=("unit-integration")
          python -m unittest tests.test_golden_pipeline -v
          [ $? -eq 0 ] || failures+=("golden")
          python -m unittest tests.test_resume -v
          [ $? -eq 0 ] || failures+=("resume")
          python -m unittest tests.test_lifecycle_failures -v
          [ $? -eq 0 ] || failures+=("failure-injection")
          "${RUNNER_TEMP}/comic-sol-audit/bin/python" -m pip_audit -r requirements/locks/runtime-linux-x86_64.txt
          [ $? -eq 0 ] || failures+=("security")
          python -m unittest tests.test_distribution tests.test_release_qualification -v
          [ $? -eq 0 ] || failures+=("artifact-contract")
          if [ ${#failures[@]} -eq 0 ]; then status=passed; else status=failed; fi
          export QUALIFY_STATUS="$status" QUALIFY_FAILURES="${failures[*]}"
          python - <<'PY'
          import json, os
          record = {
              "platform": "source",
              "status": os.environ["QUALIFY_STATUS"],
              "checks": [
                  "published-source-bytes", "published-container-bytes", "provenance",
                  "container-hardening-audit", "container-sbom",
                  "unit-integration", "golden", "resume", "failure-injection", "security", "artifact-contract",
              ],
              "exceptions": os.environ["QUALIFY_FAILURES"].split() if os.environ["QUALIFY_FAILURES"] else [],
          }
          with open("summary-source.json", "w", encoding="utf-8") as handle:
              json.dump(record, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
          exit ${#failures[@]}
      - name: Upload source qualification summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qualification-summary-source
          path: summary-source.json
          if-no-files-found: error

  aggregate:
    name: release qualification decision
    if: always()
    needs: [identity, native, wsl, source]
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.aggregate.outputs.decision }}
      summary_sha256: ${{ steps.aggregate.outputs.summary_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: qualification-summary-*
          path: qualification
          merge-multiple: true
      - name: Aggregate P0 qualification summaries
        id: aggregate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          TAG_OBJECT_SHA: ${{ inputs.tag_object_sha }}
          MAIN_SHA: ${{ inputs.main_sha }}
          MATCHED_RULESET_IDS: ${{ inputs.matched_ruleset_ids }}
          APPROVED_BYPASS_ACTORS: ${{ inputs.approved_bypass_actors }}
          IDENTITY_RESULT: ${{ needs.identity.result }}
        run: |
          set -euo pipefail
          test "$IDENTITY_RESULT" = success
          mkdir qualification-identity
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern candidate-identity.json \
            --pattern candidate-identity.json.sha256 \
            --pattern SHA256SUMS \
            --pattern SHA256SUMS.sigstore.json \
            --pattern v2.2-live-visual-summary.json \
            --pattern v2.2-live-visual-summary.md \
            --pattern v2.2-live-visual-evidence.tar.gz \
            --dir qualification-identity
          (cd qualification-identity && sha256sum -c candidate-identity.json.sha256)
          gh attestation verify qualification-identity/candidate-identity.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow wenn-id/comicsol/.github/workflows/release.yml \
            --source-digest "$CANDIDATE_SHA" \
            --source-ref "refs/tags/$RELEASE_TAG" \
            --deny-self-hosted-runners
          for subject in \
            qualification-identity/v2.2-live-visual-summary.json \
            qualification-identity/v2.2-live-visual-summary.md \
            qualification-identity/v2.2-live-visual-evidence.tar.gz; do
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow wenn-id/comicsol/.github/workflows/release.yml \
              --source-digest "$CANDIDATE_SHA" \
              --source-ref "refs/tags/$RELEASE_TAG" \
              --deny-self-hosted-runners
          done
          git ls-remote --tags origin \
            "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" \
            > qualification-aggregate-refs.txt
          python3 scripts/release_identity.py remote \
            --refs-file qualification-aggregate-refs.txt \
            --tag "$RELEASE_TAG" \
            --tag-object-sha "$TAG_OBJECT_SHA" \
            --candidate-commit "$CANDIDATE_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > qualification-release.json
          python3 scripts/release_identity.py release \
            --release-json qualification-release.json \
            --refs-file qualification-aggregate-refs.txt \
            --tag "$RELEASE_TAG" \
            --tag-object-sha "$TAG_OBJECT_SHA" \
            --candidate-commit "$CANDIDATE_SHA" \
            --require-immutable-prerelease
          # Validate every authenticated identity and policy field before the
          # harness is allowed to create a RELEASE READY summary.
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from scripts.release_visual_gate import (
              BUNDLE_ASSET,
              MARKDOWN_ASSET,
              SUMMARY_ASSET,
              validate_live_visual_summary,
          )

          identity_path = Path("qualification-identity/candidate-identity.json")
          identity = json.loads(identity_path.read_text(encoding="utf-8"))
          if identity.get("tag") != os.environ["RELEASE_TAG"]:
              raise RuntimeError("candidate identity tag does not match qualification input")
          if identity.get("candidate_commit") != os.environ["CANDIDATE_SHA"]:
              raise RuntimeError("candidate identity commit does not match qualification input")
          if identity.get("tag_object_sha") != os.environ["TAG_OBJECT_SHA"]:
              raise RuntimeError("candidate identity tag object does not match qualification input")
          if identity.get("protected_main_sha") != os.environ["MAIN_SHA"]:
              raise RuntimeError("candidate identity protected main does not match qualification input")
          expected_ruleset_ids = json.loads(os.environ["MATCHED_RULESET_IDS"])
          expected_bypass_actors = json.loads(os.environ["APPROVED_BYPASS_ACTORS"])
          if identity.get("matched_ruleset_ids") != expected_ruleset_ids:
              raise RuntimeError("candidate identity rulesets do not match qualification input")
          if identity.get("approved_bypass_actors") != expected_bypass_actors:
              raise RuntimeError("candidate identity bypass authority does not match qualification input")
          release = json.loads(Path("qualification-release.json").read_text(encoding="utf-8"))
          release_state = {
              "draft": release.get("draft"),
              "prerelease": release.get("prerelease"),
              "immutable": release.get("immutable"),
          }
          if release_state != {"draft": False, "prerelease": True, "immutable": True}:
              raise RuntimeError("qualification release is not a published immutable prerelease")
          manifest = Path("qualification-identity/SHA256SUMS")
          if hashlib.sha256(manifest.read_bytes()).hexdigest() != identity["checksum_manifest"]["sha256"]:
              raise RuntimeError("published checksum manifest does not match candidate identity")
          recorded = {
              item["name"]: item["sha256"]
              for item in [*identity["supporting_assets"], *identity["payloads"]]
          }
          for name in ("SHA256SUMS", "SHA256SUMS.sigstore.json"):
              actual = hashlib.sha256(
                  (Path("qualification-identity") / name).read_bytes()
              ).hexdigest()
              if actual != recorded[name]:
                  raise RuntimeError(f"supporting evidence digest mismatch: {name}")
          visual_root = Path("qualification-identity")
          for name in (SUMMARY_ASSET, MARKDOWN_ASSET, BUNDLE_ASSET):
              actual = hashlib.sha256((visual_root / name).read_bytes()).hexdigest()
              if actual != recorded.get(name):
                  raise RuntimeError(f"live visual payload digest mismatch: {name}")
          visual_bytes = (visual_root / SUMMARY_ASSET).read_bytes()
          visual_sha256 = hashlib.sha256(visual_bytes).hexdigest()
          live_visual_identity = identity.get("live_visual")
          if not isinstance(live_visual_identity, dict):
              raise RuntimeError("candidate live visual identity is missing")
          live_visual = validate_live_visual_summary(
              json.loads(visual_bytes),
              expected_commit=os.environ["CANDIDATE_SHA"],
              expected_version=identity["version"],
              expected_reviewer_attestation_sha256=(
                  live_visual_identity.get("reviewer_attestation_sha256")
              ),
              summary_sha256=visual_sha256,
          )
          if live_visual != live_visual_identity:
              raise RuntimeError("published live visual evidence changed from candidate identity")
          Path("qualification-live-visual.json").write_text(
              json.dumps(live_visual, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          candidate = {
              "tag": identity["tag"],
              "tag_object_sha": identity["tag_object_sha"],
              "commit_sha": identity["candidate_commit"],
              "protected_main_sha": identity["protected_main_sha"],
              "matched_ruleset_ids": identity["matched_ruleset_ids"],
              "approved_bypass_actors": identity["approved_bypass_actors"],
              "release_state": release_state,
              "checksum_manifest_sha256": identity["checksum_manifest"]["sha256"],
          }
          Path("qualification-candidate.json").write_text(
              json.dumps(candidate, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY
          # The harness emits RELEASE READY or RELEASE BLOCKED and exits non-zero when blocked.
          python scripts/release_qualification.py \
            --aggregate-root qualification \
            --aggregate-output qualification/release-summary.json \
            --require-source
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("qualification/release-summary.json")
          summary = json.loads(path.read_text(encoding="utf-8"))
          summary["candidate"] = json.loads(
              Path("qualification-candidate.json").read_text(encoding="utf-8")
          )
          summary["live_visual"] = json.loads(
              Path("qualification-live-visual.json").read_text(encoding="utf-8")
          )
          path.write_text(
              json.dumps(summary, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY
          grep -Fq "RELEASE READY" qualification/release-summary.md
          echo "decision=RELEASE READY" >> "$GITHUB_OUTPUT"
          echo "summary_sha256=$(sha256sum qualification/release-summary.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload final qualification decision
        if: steps.aggregate.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-qualification-summary
          path: |
            qualification/release-summary.json
            qualification/release-summary.md
          if-no-files-found: error
