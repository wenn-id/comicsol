name: Benchmark

on:
  pull_request:
  workflow_dispatch:
    inputs:
      baseline:
        description: "Git revision to benchmark as the baseline (defaults to the merge base or the candidate's previous commit)"
        required: false
        type: string
  workflow_call:
    inputs:
      candidate_sha:
        description: "Exact candidate commit to benchmark; empty only for ordinary event-driven runs"
        required: false
        default: ""
        type: string
      baseline:
        description: "Git revision to benchmark as the baseline"
        required: false
        default: ""
        type: string
    outputs:
      decision:
        description: "Fail-closed benchmark decision"
        value: ${{ jobs.benchmark.outputs.decision }}
      summary_sha256:
        description: "SHA-256 of summary-delta.json"
        value: ${{ jobs.benchmark.outputs.summary_sha256 }}

permissions:
  contents: read

jobs:
  benchmark:
    name: benchmark two engine revisions
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.delta.outputs.decision }}
      summary_sha256: ${{ steps.delta.outputs.summary_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
          # The baseline revision is benchmarked from a worktree of this checkout.
          fetch-depth: 0
      - name: Verify exact candidate checkout
        if: inputs.candidate_sha != ''
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install --require-hashes -r requirements/locks/base-linux-x86_64.txt

      - name: Benchmark the candidate revision
        run: |
          python scripts/benchmark.py --all \
            --output-root "${RUNNER_TEMP}/candidate/projects" \
            --results benchmark/candidate

      - name: Resolve the baseline revision
        id: baseline
        shell: bash
        env:
          REQUESTED: ${{ inputs.baseline }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED}" ]; then
            revision="$(git rev-parse "${REQUESTED}^{commit}")"
          elif [ -n "${BASE_SHA}" ]; then
            revision="$(git merge-base "${BASE_SHA}" HEAD)"
          else
            revision="$(git rev-parse HEAD~1)"
          fi
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"

      - name: Benchmark the baseline revision
        shell: bash
        env:
          BASELINE: ${{ steps.baseline.outputs.revision }}
        run: |
          set -euo pipefail
          git worktree add "${RUNNER_TEMP}/baseline-checkout" "${BASELINE}"
          # A baseline predating the harness cannot be benchmarked; run the current
          # harness against the baseline engine so the comparison stays meaningful.
          cp scripts/benchmark.py "${RUNNER_TEMP}/baseline-checkout/scripts/benchmark.py"
          cp -r benchmarks "${RUNNER_TEMP}/baseline-checkout/benchmarks"
          cd "${RUNNER_TEMP}/baseline-checkout"
          python scripts/benchmark.py --all \
            --output-root "${RUNNER_TEMP}/baseline/projects" \
            --results "${GITHUB_WORKSPACE}/benchmark/baseline"

      - name: Summarize the candidate revision
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'from comic_sol_product import __version__; print(__version__)')"
          python scripts/benchmark_summary.py \
            --results benchmark/candidate \
            --consistency-baseline "benchmarks/consistency/baseline-v${version}.json" \
            --output benchmark/candidate-summary.json

      - name: Summarize the baseline revision
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark_summary.py \
            --results benchmark/baseline \
            --output benchmark/baseline-summary.json

      - name: Diff the two revisions
        id: delta
        shell: bash
        env:
          BASELINE_SHA: ${{ steps.baseline.outputs.revision }}
        run: |
          set -euo pipefail
          python scripts/benchmark.py \
            --baseline benchmark/baseline \
            --candidate benchmark/candidate \
            --diff-output benchmark/diff.json
          python scripts/benchmark_summary.py \
            --baseline benchmark/baseline-summary.json \
            --candidate benchmark/candidate-summary.json \
            --output benchmark/summary-delta.json
          CANDIDATE_SHA="$(git rev-parse HEAD)" python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("benchmark/summary-delta.json")
          record = json.loads(path.read_text(encoding="utf-8"))
          record["candidate_sha"] = os.environ["CANDIDATE_SHA"]
          record["baseline_sha"] = os.environ["BASELINE_SHA"]
          path.write_text(
              json.dumps(record, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY
          test "$(jq -r .decision benchmark/summary-delta.json)" = "NO REGRESSION"
          test "$(jq -r .status benchmark/summary-delta.json)" = "passed"
          grep -Fq "NO REGRESSION" benchmark/diff.md
          grep -Fq "NO REGRESSION" benchmark/summary-delta.md
          echo "decision=NO REGRESSION" >> "$GITHUB_OUTPUT"
          echo "summary_sha256=$(sha256sum benchmark/summary-delta.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish the benchmark report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for report in \
            benchmark/candidate-summary.md \
            benchmark/baseline-summary.md \
            benchmark/summary-delta.md \
            benchmark/diff.md; do
            if [ -f "${report}" ]; then
              cat "${report}" >> "$GITHUB_STEP_SUMMARY"
              printf '\\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: benchmark-results
          path: benchmark/
          if-no-files-found: error
