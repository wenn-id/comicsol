name: Native Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (must equal package version, e.g. vX.Y.Z)"
        required: true
        type: string
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Resolve release identity
        id: identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          TAG="$RELEASE_TAG"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          python -m pip install packaging==25.0
          PRERELEASE=$(RELEASE_VERSION="$VERSION" python -c 'import os; from packaging.version import Version; print(str(Version(os.environ["RELEASE_VERSION"]).is_prerelease).lower())')
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "detected-version=$(python -c 'from comic_sol_product import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"
      - name: Verify tag matches package version
        shell: bash
        run: |
          VERSION="${{ steps.identity.outputs.version }}"
          DETECTED="${{ steps.identity.outputs.detected-version }}"
          if [ "$VERSION" != "$DETECTED" ]; then
            echo "release tag $VERSION does not match package version $DETECTED" >&2
            exit 1
          fi
      - name: Build wheel
        shell: bash
        run: |
          python -m pip install build==1.3.0 setuptools==80.9.0 cyclonedx-bom==7.3.1
          python -m build
          python -m comic_sol_product.release dist/*.whl dist/*.tar.gz
      - name: Build bundled runtime
        shell: bash
        run: python scripts/build_portable.py --wheel dist/*.whl --output native
      - name: Smoke bundled runtime and MCP
        run: |
          python -m pip install mcp==1.28.1
          python scripts/portable_release_smoke.py --runtime native/comic-sol
      - name: Assemble SBOM, metadata, and SHA256SUMS
        run: python scripts/assemble_release.py --runtime native/comic-sol --environment native/build-environment.sbom.json --output release --platform ${{ matrix.platform }} --architecture x86_64
      - name: Upload native bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: comic-sol-${{ matrix.platform }}-x86_64
          path: release/*
          if-no-files-found: error

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Resolve release identity
        id: identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          TAG="$RELEASE_TAG"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build OCI image
        run: docker build -t comic-sol:${{ steps.identity.outputs.version }} .
      - name: Smoke OCI image
        run: docker run --rm --entrypoint comic-sol comic-sol:${{ steps.identity.outputs.version }} doctor --output-root /data/doctor

  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Build and validate source packages
        run: |
          python -m pip install build==1.3.0 setuptools==80.9.0
          python -m build
          python -m comic_sol_product.release dist/*.whl dist/*.tar.gz
          mkdir source-assets
          cp dist/*.whl dist/*.tar.gz installers/install.sh installers/install.ps1 source-assets/
      - name: Upload source packages and installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: comic-sol-source
          path: source-assets/*
          if-no-files-found: error

  publish:
    needs: [native, container, source]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install CycloneDX validator
        run: python -m pip install cyclonedx-bom==7.3.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: comic-sol-*
          path: bundles
      - name: Resolve release identity
        id: identity
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          python -m pip install packaging==25.0
          PRERELEASE=$(RELEASE_VERSION="$VERSION" python -c 'import os; from packaging.version import Version; print(str(Version(os.environ["RELEASE_VERSION"]).is_prerelease).lower())')
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
      - name: Verify platform bundles and create global SHA256SUMS
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path
          from comic_sol_product.distribution import ReleaseIdentity, validate_sbom_schema, verify_release_directory
          version = os.environ["RELEASE_VERSION"]
          root = Path("bundles")
          records = []
          for platform in ("linux", "macos", "windows"):
              bundle = root / f"comic-sol-{platform}-x86_64"
              identity = ReleaseIdentity(version, platform, "x86_64")
              verify_release_directory(bundle, identity)
              validate_sbom_schema(bundle / f"{identity.stem}.sbom.json")
              for path in sorted(bundle.iterdir()):
                  if path.name == "SHA256SUMS":
                      continue
                  records.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          for path in sorted((root / "comic-sol-source").iterdir()):
              records.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          destination = root / "SHA256SUMS"
          destination.write_text("\n".join(sorted(records)) + "\n", encoding="utf-8", newline="\n")
          PY
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
      - name: Attest release archives and source packages
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            bundles/**/*.zip
            bundles/**/*.whl
            bundles/**/*.tar.gz
      - name: Publish immutable release assets
        shell: bash
        run: |
          TAG="${{ steps.identity.outputs.tag }}"
          VERSION="${{ steps.identity.outputs.version }}"
          PRERELEASE="${{ steps.identity.outputs.prerelease }}"
          NOTES="docs/releases/${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            echo "release notes not found: $NOTES" >&2
            exit 1
          fi
          gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" --verify-tag \
            $([ "$PRERELEASE" = "true" ] && echo --prerelease) \
            --title "Comic Sol ${VERSION}" --notes-file "$NOTES"
          find bundles -type f ! -name SHA256SUMS -print0 | xargs -0 gh release upload "$TAG" --repo "${GITHUB_REPOSITORY}" --clobber
          gh release upload "$TAG" bundles/SHA256SUMS --repo "${GITHUB_REPOSITORY}" --clobber
