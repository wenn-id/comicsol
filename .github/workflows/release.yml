name: Native Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish (must equal package version, e.g. vX.Y.Z)"
        required: true
        type: string
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

env:
  DOCKER_BASE_DIGEST: sha256:90744cff8f32887f075c47d747a173ff333e9e98801667af93c357fa9f5e28ff

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      sha: ${{ steps.identity.outputs.sha }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.15'
      - name: Install pinned release metadata tools
        run: python -m pip install --require-hashes -r requirements/locks/release-linux-x86_64.txt
      - name: Verify tag matches package version
        id: identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          TAG="$RELEASE_TAG"
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "invalid release tag: $TAG" >&2; exit 1 ;;
          esac
          git show-ref --verify --quiet "refs/tags/$TAG"
          SHA="$(git rev-parse "${TAG}^{commit}")"
          VERSION="${TAG#v}"
          DETECTED="$(python -c 'from comic_sol_product import __version__; print(__version__)')"
          if [ "$VERSION" != "$DETECTED" ]; then
            echo "release tag $VERSION does not match package version $DETECTED" >&2
            exit 1
          fi
          PRERELEASE="$(RELEASE_VERSION="$VERSION" python -c 'import os; from packaging.version import Version; print(str(Version(os.environ["RELEASE_VERSION"]).is_prerelease).lower())')"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "sha=$SHA"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.15'
      - name: Install locked build environment
        shell: bash
        run: python -m pip install --require-hashes -r requirements/locks/release-${{ matrix.platform }}-x86_64.txt
      - name: Build and validate wheel
        shell: bash
        run: |
          python -m build --no-isolation
          python -m comic_sol_product.release dist/*.whl dist/*.tar.gz
      - name: Build and smoke bundled runtime
        shell: bash
        run: |
          python scripts/build_portable.py --wheel dist/*.whl --output native --lock requirements/locks/release-${{ matrix.platform }}-x86_64.txt
          python scripts/portable_release_smoke.py --runtime native/comic-sol
          python scripts/assemble_release.py --runtime native/comic-sol --environment native/build-environment.sbom.json --output release --platform ${{ matrix.platform }} --architecture x86_64
      - name: Upload native bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: comic-sol-${{ matrix.platform }}-x86_64
          path: release/*
          if-no-files-found: error

  container:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build OCI image from locked source
        run: docker build --build-arg DOCKER_BASE_DIGEST="$DOCKER_BASE_DIGEST" -t comic-sol:${{ needs.prepare.outputs.version }} .
      - name: Smoke OCI image
        run: docker run --rm --entrypoint comic-sol comic-sol:${{ needs.prepare.outputs.version }} doctor --output-root /data/doctor

  source:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.15'
      - name: Build and validate source packages
        run: |
          python -m pip install --require-hashes -r requirements/locks/release-linux-x86_64.txt
          python -m build --no-isolation
          python -m comic_sol_product.release dist/*.whl dist/*.tar.gz
          mkdir source-assets
          cp dist/*.whl dist/*.tar.gz installers/install.sh installers/install.ps1 source-assets/
      - name: Upload source packages and installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: comic-sol-source
          path: source-assets/*
          if-no-files-found: error

  publish:
    needs: [prepare, native, container, source]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.15'
      - name: Install pinned release validator
        run: python -m pip install --require-hashes -r requirements/locks/release-linux-x86_64.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: comic-sol-*
          path: bundles
      - name: Verify bundles and create global SHA256SUMS
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from comic_sol_product.distribution import ReleaseIdentity, validate_sbom_schema, verify_release_directory
          root = Path("bundles")
          records = []
          for platform in ("linux", "macos", "windows"):
              bundle = root / f"comic-sol-{platform}-x86_64"
              identity = ReleaseIdentity(os.environ["RELEASE_VERSION"], platform, "x86_64")
              verify_release_directory(bundle, identity)
              validate_sbom_schema(bundle / f"{identity.stem}.sbom.json")
              for path in sorted(bundle.iterdir()):
                  if path.name != "SHA256SUMS":
                      records.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          for path in sorted((root / "comic-sol-source").iterdir()):
              records.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          (root / "SHA256SUMS").write_text("\n".join(sorted(records)) + "\n", encoding="utf-8", newline="\n")
          PY
      - name: Attest release archives and source packages
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            bundles/**/*.zip
            bundles/**/*.whl
            bundles/**/*.tar.gz
      - name: Publish immutable release assets
        shell: bash
        run: |
          NOTES="docs/releases/${RELEASE_VERSION}.md"
          test -f "$NOTES"
          EXTRA=""
          if [ "$RELEASE_PRERELEASE" = true ]; then EXTRA="--prerelease"; fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag $EXTRA --title "Comic Sol ${RELEASE_VERSION}" --notes-file "$NOTES"
          find bundles -type f ! -name SHA256SUMS -print0 | xargs -0 gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$RELEASE_TAG" bundles/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
