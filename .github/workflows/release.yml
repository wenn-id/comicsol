name: Native Release

on:
  workflow_dispatch:
  push:
    tags: [ 'v2.0.0rc2' ]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Build wheel
        shell: bash
        run: |
          python -m pip install build==1.3.0 setuptools==80.9.0
          python -m build
          python -m comic_sol_product.release dist/*.whl dist/*.tar.gz
      - name: Build bundled runtime
        shell: bash
        run: python scripts/build_portable.py --wheel dist/*.whl --output native
      - name: Smoke bundled runtime and MCP
        run: |
          python -m pip install mcp==1.28.1
          python scripts/portable_release_smoke.py --runtime native/comic-sol
      - name: Assemble SBOM, metadata, and SHA256SUMS
        run: python scripts/assemble_release.py --runtime native/comic-sol --output release --platform ${{ matrix.platform }} --architecture x86_64
      - name: Upload native bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: comic-sol-${{ matrix.platform }}-x86_64
          path: release/*
          if-no-files-found: error

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build OCI image
        run: docker build -t comic-sol:2.0.0rc2 .
      - name: Smoke OCI image
        run: docker run --rm --entrypoint comic-sol comic-sol:2.0.0rc2 doctor --output-root /data/doctor

  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Build and validate source packages
        run: |
          python -m pip install build==1.3.0 setuptools==80.9.0
          python -m build
          python -m comic_sol_product.release dist/*.whl dist/*.tar.gz
          mkdir source-assets
          cp dist/*.whl dist/*.tar.gz installers/install.sh installers/install.ps1 source-assets/
      - name: Upload source packages and installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: comic-sol-source
          path: source-assets/*
          if-no-files-found: error

  publish:
    needs: [native, container, source]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/tags/v2.0.0rc2'
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      prerelease: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: comic-sol-*
          path: bundles
      - name: Verify platform bundles and create global SHA256SUMS
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from comic_sol_product.distribution import ReleaseIdentity, verify_release_directory
          root = Path('bundles')
          records = []
          for platform in ('linux', 'macos', 'windows'):
              bundle = root / f'comic-sol-{platform}-x86_64'
              verify_release_directory(bundle, ReleaseIdentity('2.0.0rc2', platform, 'x86_64'))
              for path in sorted(bundle.iterdir()):
                  if path.name == 'SHA256SUMS':
                      continue
                  records.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          for path in sorted((root / 'comic-sol-source').iterdir()):
              records.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          destination = root / 'SHA256SUMS'
          destination.write_text('\n'.join(sorted(records)) + '\n', encoding='utf-8', newline='\n')
          PY
      - name: Publish immutable prerelease assets
        shell: bash
        run: |
          gh release create v2.0.0rc2 --repo "${GITHUB_REPOSITORY}" --verify-tag --prerelease --title 'Comic Sol v2.0.0rc2' --notes-file docs/releases/v2.0.0rc2.md
          find bundles -type f ! -name SHA256SUMS -print0 | xargs -0 gh release upload v2.0.0rc2 --repo "${GITHUB_REPOSITORY}" --clobber
          gh release upload v2.0.0rc2 bundles/SHA256SUMS --repo "${GITHUB_REPOSITORY}" --clobber
