name: Tests

on:
  push:
    branches: [ main ]
  # Validate every pull request; `main` is the canonical public product branch.
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        extras: [base, mcp]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
    - name: Set up Python 3.11
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.11"
    - name: Install base dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
    - name: Install MCP extras (if MCP job)
      if: matrix.extras == 'mcp'
      run: python -m pip install -r requirements-mcp.txt
    - name: Audit dependency manifests for known vulnerabilities
      run: |
        python -m pip install pip-audit==2.10.1
        python -m pip_audit -r requirements.txt
        python -m pip_audit -r requirements-mcp.txt
    - name: Test with unittest
      # Unprivileged Windows cannot create file symlinks, so the path-containment
      # tests may only skip there; everywhere else a skip is a coverage loss.
      env:
        COMIC_SOL_REQUIRE_SYMLINK_TESTS: ${{ matrix.os == 'windows-latest' && '0' || '1' }}
      run: python -m unittest discover -s tests -v
    - name: Run doctor
      run: python scripts/comic_sol.py doctor --output-root ${{ runner.temp }}/comic-sol-doctor
    - name: Build installable package
      run: |
        python -m pip install build==1.3.0
        python -m build
    - name: Validate wheel and source distribution contents
      shell: bash
      run: python -m comic_sol_product.release dist/*.whl dist/*.tar.gz
    - name: Smoke test clean wheel installation outside checkout
      shell: bash
      run: |
        if [ "${{ matrix.extras }}" = "mcp" ]; then
          python scripts/clean_install_smoke.py --wheel dist/*.whl --mcp
        else
          python scripts/clean_install_smoke.py --wheel dist/*.whl
        fi

  native-distribution:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
    - name: Set up Python 3.11
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.11"
    - name: Build validated wheel
      run: |
        python -m pip install build==1.3.0 setuptools==80.9.0
        python -m build
        python -m comic_sol_product.release dist/*.whl dist/*.tar.gz
    - name: Build and smoke bundled runtime
      run: |
        python -m pip install mcp==1.28.1
        python scripts/build_portable.py --wheel dist/*.whl --output native
        python scripts/portable_release_smoke.py --runtime native/comic-sol
        python scripts/assemble_release.py --runtime native/comic-sol --output release --platform linux --architecture x86_64
    - name: Build and smoke non-root OCI image
      run: |
        docker build -t comic-sol:pr .
        docker run --rm --entrypoint comic-sol comic-sol:pr --version
        docker run --rm --entrypoint comic-sol comic-sol:pr doctor --output-root /data/doctor
        test "$(docker run --rm --entrypoint sh comic-sol:pr -c 'id -u')" != "0"
