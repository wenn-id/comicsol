name: Tests

on:
  push:
    branches: [ main ]
  # Validate every pull request; `main` is the canonical public product branch.
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate_sha:
        description: "Exact candidate commit to test; empty only for ordinary event-driven runs"
        required: false
        default: ""
        type: string

jobs:
  test:
    strategy:
      fail-fast: false
      # The full base and MCP suites must run on native macOS arm64 because
      # the release artifacts are arm64: cryptography publishes no x86_64
      # macOS wheel since 49.0.0, so the MCP extras are arm64-only there.
      # Intel macOS keeps explicit, separate coverage in the test-macos-intel
      # job below with the base extras only.
      matrix:
        include:
          - os: ubuntu-latest
            lock: linux
            extras: base
          - os: ubuntu-latest
            lock: linux
            extras: mcp
          - os: macos-latest
            lock: macos
            extras: base
          - os: macos-latest
            lock: macos
            extras: mcp
          - os: windows-latest
            lock: windows
            extras: base
          - os: windows-latest
            lock: windows
            extras: mcp
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: ${{ inputs.candidate_sha || github.sha }}
    - name: Set up Python 3.11
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.11"
    - name: Install base dependencies
      run: |
        python -m pip install --require-hashes -r requirements/locks/base-${{ matrix.lock }}-x86_64.txt
    - name: Install MCP extras (if MCP job)
      if: matrix.extras == 'mcp'
      run: python -m pip install --require-hashes -r requirements/locks/runtime-${{ matrix.lock }}-x86_64.txt
    - name: Audit dependency manifests for known vulnerabilities
      shell: bash
      run: |
        audit_root="${RUNNER_TEMP}/comic-sol-audit"
        python -m venv "${audit_root}"
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          audit_python="${audit_root}/Scripts/python.exe"
        else
          audit_python="${audit_root}/bin/python"
        fi
        "${audit_python}" -m pip install --require-hashes -r requirements/locks/audit-python311.txt
        "${audit_python}" -m pip_audit -r requirements/locks/runtime-${{ matrix.lock }}-x86_64.txt
    - name: Verify isolated test discovery
      run: python -m unittest tests.test_isolated_discovery -v
    - name: Test with unittest
      # Unprivileged Windows cannot create file symlinks, so the path-containment
      # tests may only skip there; everywhere else a skip is a coverage loss.
      env:
        COMIC_SOL_REQUIRE_SYMLINK_TESTS: ${{ matrix.os == 'windows-latest' && '0' || '1' }}
      run: python -m unittest discover -s tests -v
    - name: Run doctor
      run: python scripts/comic_sol.py doctor --output-root ${{ runner.temp }}/comic-sol-doctor
    - name: Build installable package
      run: |
        python -m pip install --require-hashes -r requirements/locks/release-${{ matrix.lock }}-x86_64.txt
        python -m build --no-isolation
    - name: Validate wheel and source distribution contents
      if: runner.os != 'Windows'
      shell: bash
      run: python -m comic_sol_product.release dist/*.whl dist/*.tar.gz
    - name: Validate wheel and source distribution contents in PowerShell
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $artifacts = Get-ChildItem -Path dist\*.whl, dist\*.tar.gz |
          Select-Object -ExpandProperty FullName
        python -m comic_sol_product.release @artifacts
    - name: Smoke test clean wheel installation outside checkout
      shell: bash
      run: |
        if [ "${{ matrix.extras }}" = "mcp" ]; then
          python scripts/clean_install_smoke.py --wheel dist/*.whl --mcp
        else
          python scripts/clean_install_smoke.py --wheel dist/*.whl
        fi

  # Intel macOS is not a release target: cryptography publishes no x86_64
  # macOS wheel since 49.0.0, so the MCP extras, the release build lock, and
  # the frozen runtime artifacts are arm64-only. This leg keeps Intel source
  # support explicit and separately tested with the base extras instead of
  # letting it silently ride the arm64 release matrix.
  test-macos-intel:
    name: Test macOS Intel base (explicit non-release leg)
    runs-on: macos-26-intel
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: ${{ inputs.candidate_sha || github.sha }}
        persist-credentials: false
    - name: Set up Python 3.11
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.11"
    - name: Install base dependencies
      run: |
        python -m pip install --require-hashes -r requirements/locks/base-macos-x86_64.txt
    - name: Audit base dependency manifest for known vulnerabilities
      shell: bash
      run: |
        audit_root="${RUNNER_TEMP}/comic-sol-audit"
        python -m venv "${audit_root}"
        "${audit_root}/bin/python" -m pip install --require-hashes -r requirements/locks/audit-python311.txt
        "${audit_root}/bin/python" -m pip_audit -r requirements/locks/base-macos-x86_64.txt
    - name: Verify isolated test discovery
      run: python -m unittest tests.test_isolated_discovery -v
    - name: Test with unittest
      env:
        COMIC_SOL_REQUIRE_SYMLINK_TESTS: "1"
      run: python -m unittest discover -s tests -v
    - name: Run doctor
      run: python scripts/comic_sol.py doctor --output-root ${{ runner.temp }}/comic-sol-doctor

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: ${{ inputs.candidate_sha || github.sha }}
    - name: Set up Python 3.11
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.11"
    - name: Install runtime dependencies
      run: python -m pip install --require-hashes -r requirements/locks/runtime-linux-x86_64.txt
    - name: Install quality tools
      run: python -m pip install --require-hashes -r requirements/locks/quality-linux-x86_64.txt
    - name: Ruff lint
      run: python -m ruff check scripts comic_sol_product tests
    - name: Ruff format check
      run: python -m ruff format --check scripts comic_sol_product tests
    - name: Mypy incremental scope
      run: python -m mypy
    - name: Application coverage gates
      run: |
        python -m coverage run -m unittest discover -s tests
        python -m coverage json -o coverage.json
        python scripts/check_coverage.py coverage.json
        python -m coverage report
        python -m coverage xml -o coverage.xml
        python -m coverage html -d coverage-html
    - name: Upload coverage artifact
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: quality-coverage
        path: |
          coverage.json
          coverage.xml
          coverage-html/

  native-distribution:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: ${{ inputs.candidate_sha || github.sha }}
    - name: Set up Python 3.11
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.11"
    - name: Build validated wheel
      run: |
        python -m pip install --require-hashes -r requirements/locks/release-linux-x86_64.txt
        python -m build --no-isolation
        python -m comic_sol_product.release dist/*.whl dist/*.tar.gz
    - name: Build and smoke bundled runtime
      run: |
        python -m pip install --require-hashes -r requirements/locks/release-linux-x86_64.txt
        python scripts/build_portable.py --wheel dist/*.whl --output native --lock requirements/locks/release-linux-x86_64.txt
        python scripts/portable_release_smoke.py --runtime native/comic-sol
        python scripts/assemble_release.py --runtime native/comic-sol --environment native/build-environment.sbom.json --output release --platform linux --architecture x86_64
    - name: Build and audit hardened non-root OCI image
      run: |
        docker build -t comic-sol:pr .
        docker run --rm --entrypoint comic-sol comic-sol:pr --version
        python scripts/container_runtime_audit.py --image comic-sol:pr --expect-version "$(python -c 'from comic_sol_product import __version__; print(__version__)')"
