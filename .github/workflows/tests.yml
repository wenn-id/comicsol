name: Tests

on:
  push:
    branches: [ main ]
  # Validate every pull request; `main` is the canonical public product branch.
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26-intel, windows-latest]
        extras: [base, mcp]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python 3.11
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.11"
    - name: Install base dependencies
      run: |
        python -m pip install --require-hashes -r requirements/locks/base-${{ matrix.os == 'ubuntu-latest' && 'linux' || matrix.os == 'macos-26-intel' && 'macos' || 'windows' }}-x86_64.txt
    - name: Install MCP extras (if MCP job)
      if: matrix.extras == 'mcp'
      run: python -m pip install --require-hashes -r requirements/locks/runtime-${{ matrix.os == 'ubuntu-latest' && 'linux' || matrix.os == 'macos-26-intel' && 'macos' || 'windows' }}-x86_64.txt
    - name: Audit dependency manifests for known vulnerabilities
      shell: bash
      run: |
        audit_root="${RUNNER_TEMP}/comic-sol-audit"
        python -m venv "${audit_root}"
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          audit_python="${audit_root}/Scripts/python.exe"
        else
          audit_python="${audit_root}/bin/python"
        fi
        "${audit_python}" -m pip install --require-hashes -r requirements/locks/audit-python311.txt
        "${audit_python}" -m pip_audit -r requirements/locks/runtime-${{ matrix.os == 'ubuntu-latest' && 'linux' || matrix.os == 'macos-26-intel' && 'macos' || 'windows' }}-x86_64.txt
    - name: Test with unittest
      # Unprivileged Windows cannot create file symlinks, so the path-containment
      # tests may only skip there; everywhere else a skip is a coverage loss.
      env:
        COMIC_SOL_REQUIRE_SYMLINK_TESTS: ${{ matrix.os == 'windows-latest' && '0' || '1' }}
      run: python -m unittest discover -s tests -v
    - name: Run doctor
      run: python scripts/comic_sol.py doctor --output-root ${{ runner.temp }}/comic-sol-doctor
    - name: Build installable package
      run: |
        python -m pip install --require-hashes -r requirements/locks/release-${{ matrix.os == 'ubuntu-latest' && 'linux' || matrix.os == 'macos-26-intel' && 'macos' || 'windows' }}-x86_64.txt
        python -m build --no-isolation
    - name: Validate wheel and source distribution contents
      shell: bash
      run: python -m comic_sol_product.release dist/*.whl dist/*.tar.gz
    - name: Smoke test clean wheel installation outside checkout
      shell: bash
      run: |
        if [ "${{ matrix.extras }}" = "mcp" ]; then
          python scripts/clean_install_smoke.py --wheel dist/*.whl --mcp
        else
          python scripts/clean_install_smoke.py --wheel dist/*.whl
        fi

  native-distribution:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python 3.11
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.11"
    - name: Build validated wheel
      run: |
        python -m pip install --require-hashes -r requirements/locks/release-linux-x86_64.txt
        python -m build --no-isolation
        python -m comic_sol_product.release dist/*.whl dist/*.tar.gz
    - name: Build and smoke bundled runtime
      run: |
        python -m pip install --require-hashes -r requirements/locks/release-linux-x86_64.txt
        python scripts/build_portable.py --wheel dist/*.whl --output native --lock requirements/locks/release-linux-x86_64.txt
        python scripts/portable_release_smoke.py --runtime native/comic-sol
        python scripts/assemble_release.py --runtime native/comic-sol --environment native/build-environment.sbom.json --output release --platform linux --architecture x86_64
    - name: Build and smoke non-root OCI image
      run: |
        docker build -t comic-sol:pr .
        docker run --rm --entrypoint comic-sol comic-sol:pr --version
        docker run --rm --entrypoint comic-sol comic-sol:pr doctor --output-root /data/doctor
        test "$(docker run --rm --entrypoint sh comic-sol:pr -c 'id -u')" != "0"
