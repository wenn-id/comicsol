<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Comic Sol Studio</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <a class="skip-link" href="#studio-main">Skip to Studio content</a>
    <header class="site-header">
      <div>
        <p class="eyebrow">Comic Sol</p>
        <h1>Studio</h1>
      </div>
      <nav aria-label="Studio steps">
        <button id="start-tab" class="step-tab" type="button" data-view="start" aria-current="page">1. Start</button>
        <button id="plan-tab" class="step-tab" type="button" data-view="plan" aria-current="false" disabled>2. Plan</button>
        <button id="generate-tab" class="step-tab" type="button" data-view="generate" aria-current="false" disabled>3. Generate</button>
        <button id="review-tab" class="step-tab" type="button" data-view="review" aria-current="false" disabled>4. Review</button>
      </nav>
    </header>
    <main id="studio-main" tabindex="-1">
      <div id="studio-view"></div>
    </main>
    <div id="studio-status" class="status-region" role="status" aria-live="polite" aria-atomic="true"></div>
    <footer>
      <p>Private project content stays in this authenticated Studio session.</p>
    </footer>
    <noscript>Comic Sol Studio requires JavaScript to create or import a project.</noscript>
    <script type="module" src="./app.js"></script>
    <script type="module" id="creator-webmcp-bootstrap">
      import { registerCreatorWebMcp } from "./app.js";

      const CORE_TOOL_COUNT = 14;
      const CREATOR_TOOL_NAMES = Object.freeze([
        "get_comic_context",
        "create_comic",
        "revise_comic",
      ]);
      const MAX_ATTEMPTS = 40;
      const RETRY_DELAY_MS = 25;

      function modelContext() {
        const documentContext = typeof document === "undefined" ? null : document.modelContext;
        if (documentContext && typeof documentContext.getTools === "function") {
          return documentContext;
        }
        const navigatorContext = typeof navigator === "undefined" ? null : navigator.modelContext;
        return navigatorContext && typeof navigatorContext.getTools === "function"
          ? navigatorContext
          : null;
      }

      function delay(milliseconds) {
        return new Promise((resolve) => setTimeout(resolve, milliseconds));
      }

      async function registerCreatorToolsAfterCore() {
        const context = modelContext();
        if (!context) return false;

        for (let attempt = 0; attempt < MAX_ATTEMPTS; attempt += 1) {
          const tools = await context.getTools();
          const names = new Set(Array.isArray(tools) ? tools.map((tool) => tool?.name) : []);
          if (CREATOR_TOOL_NAMES.every((name) => names.has(name))) return true;
          if (tools.length >= CORE_TOOL_COUNT) return registerCreatorWebMcp();
          await delay(RETRY_DELAY_MS);
        }
        return false;
      }

      void registerCreatorToolsAfterCore();
    </script>
  </body>
</html>
