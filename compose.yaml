services:
  comic-sol:
    build: .
    image: comic-sol:2.0.0rc6
    read_only: true
    command: ["mcp", "--root", "/data"]
    volumes:
      - comic-sol-data:/data
    tmpfs:
      - /tmp
    network_mode: none
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    security_opt:
      - no-new-privileges:true

volumes:
  comic-sol-data:
